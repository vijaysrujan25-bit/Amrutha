<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Amrutha</title>
  <meta name="description" content="Contact Amrutha">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation -->
  <header>
    <div class="logo text-gradient">Amrutha.</div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="education.html">Education</a></li>
        <li><a href="certifications.html">Certifications</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <button class="hamburger">☰</button>
  </header>

  <!-- Main Content -->
  <main>
    <section class="container animate-on-scroll">
      <h2>Get In Touch</h2>
      
      <div class="contact-container">
        <div class="contact-info">
          <h3 style="margin-bottom: 2rem; font-size: 1.5rem;">Let's Connect</h3>
          
          <div class="contact-item">
            <div class="contact-icon">📧</div>
            <div>
              <p style="margin-bottom: 0; font-weight: bold; color: var(--text-primary);">Email</p>
              <!-- Mailto link functionality -->
              <a href="mailto:amrutha@example.com" class="text-gradient">amrutha@example.com</a>
            </div>
          </div>
          
          <div class="contact-item">
            <div class="contact-icon">📱</div>
            <div>
              <p style="margin-bottom: 0; font-weight: bold; color: var(--text-primary);">Phone</p>
              <p>+1 234 567 890</p>
            </div>
          </div>
          
          <div class="contact-item">
            <div class="contact-icon">📍</div>
            <div>
              <p style="margin-bottom: 0; font-weight: bold; color: var(--text-primary);">Location</p>
              <p>City, Country</p>
            </div>
          </div>
        </div>
        
        <form class="contact-form" onsubmit="event.preventDefault(); window.location.href='mailto:amrutha@example.com';">
          <div class="form-group">
            <input type="text" placeholder="Your Name" required>
          </div>
          <div class="form-group">
            <input type="email" placeholder="Your Email" required>
          </div>
          <div class="form-group">
            <textarea placeholder="Your Message" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Send Message</button>
        </form>
      </div>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
